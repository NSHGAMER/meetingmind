services:
  - type: web
    name: meetingmind-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./meetingmind.db
      - key: CORS_ORIGINS
        sync: false      # set to your Vercel URL e.g. https://meetingmind.vercel.app
      - key: HINDSIGHT_API_URL
        value: https://api.hindsight.vectorize.io
      - key: HINDSIGHT_API_KEY
        sync: false
      - key: HINDSIGHT_BANK_PREFIX
        value: meetingmind
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: MAX_UPLOAD_MB
        value: "2"
    # Optional persistent disk for Render Starter (paid) plan:
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
